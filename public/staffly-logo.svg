<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon/Symbol -->
  <g id="icon">
    <!-- Outer Circle with Gradient -->
    <circle cx="30" cy="30" r="28" fill="url(#gradient1)" />
    
    <!-- Inner Design - Abstract "S" with AI element -->
    <path d="M 20 18 Q 25 15 30 18 Q 35 21 35 26 Q 35 30 30 32 Q 25 34 25 38 Q 25 42 30 44 Q 35 46 40 43" 
          stroke="white" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          fill="none"
          opacity="0.95"/>
    
    <!-- AI Dots/Nodes -->
    <circle cx="22" cy="20" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="38" cy="28" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="32" cy="40" r="2.5" fill="white" opacity="0.9"/>
    
    <!-- Connection Lines (subtle) -->
    <line x1="22" y1="20" x2="30" y2="18" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="38" y1="28" x2="35" y2="26" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="32" y1="40" x2="30" y2="44" stroke="white" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Text "Staffly" -->
  <g id="text">
    <text x="68" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1e293b">
      Staffly
    </text>
    <!-- AI Badge -->
    <rect x="152" y="20" width="28" height="16" rx="8" fill="url(#gradient2)"/>
    <text x="166" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">
      AI
    </text>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>

